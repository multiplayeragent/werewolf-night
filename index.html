<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Werewolf Night</title>
<style>
  :root { --ink: #f3f0ff; --dim: #aab0d4; --panel: #10152ef0; --wolf: #ff5b6e; --seer: #c39bff; --vill: #7fd6a0; --gold: #ffd166; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0a0f2c; }
  body { font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; left: 0; top: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  [hidden] { display: none !important; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000c; }
  #top { top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: 92vw; }
  #top > span { padding: 6px 12px; border-radius: 999px; background: #0008; font-size: 13px; font-weight: 700; }
  #phase { font-weight: 900 !important; letter-spacing: .08em; }
  #msg { text-align: center; font-weight: 900; font-size: clamp(20px, 4.4vw, 40px); line-height: 1.15; box-sizing: border-box; padding: 0 8px; }
  #msg .b { display: inline-block; background: #090c25b8; padding: 8px 18px 10px; border-radius: 16px; }
  #msg small { display: block; font-size: clamp(13px, 2.2vw, 18px); font-weight: 600; margin-top: 6px; color: #ebe8ff; }
  .wolf { color: var(--wolf); } .seer { color: var(--seer); } .villager { color: var(--vill); } .gold { color: var(--gold); }
  #side { position: fixed; display: flex; flex-direction: column; gap: 8px; padding: 10px; box-sizing: border-box; background: var(--panel); }
  #side.right { border-left: 1px solid #ffffff1c; padding-top: max(10px, env(safe-area-inset-top)); padding-right: max(10px, env(safe-area-inset-right)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #side.bottom { border-top: 1px solid #ffffff1c; border-radius: 16px 16px 0 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
  #hint { font-weight: 700; font-size: 14px; color: var(--gold); min-height: 1.3em; }
  #chat { flex: 1; min-height: 40px; overflow: auto; background: #0005; border-radius: 12px; padding: 8px 10px; font-size: 14px; display: flex; flex-direction: column; gap: 3px; user-select: text; -webkit-user-select: text; }
  #chat b { margin-right: 6px; } #chat .sys { color: var(--dim); font-style: italic; }
  #say { display: flex; gap: 8px; }
  #say input, #name { flex: 1; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid #ffffff33; background: #ffffff12; color: #fff; padding: 0 12px; font: inherit; font-size: 16px; box-sizing: border-box; }
  #say input:disabled { opacity: .45; }
  #say button, .go, #skip { min-height: 44px; border: 0; border-radius: 12px; background: var(--gold); color: #2a1d00; font: 800 15px system-ui, sans-serif; padding: 0 16px; cursor: pointer; }
  #say button:disabled { opacity: .4; cursor: default; }
  #row { display: flex; gap: 8px; align-items: center; }
  #skip { background: #ffffff22; color: #fff; flex: 1; } #skip.mine { background: #ffd16655; }
  #lobby { display: flex; gap: 8px; align-items: center; flex: 1; font-size: 13px; color: var(--dim); }
  #net { bottom: max(6px, env(safe-area-inset-bottom)); left: max(10px, env(safe-area-inset-left)); font-size: 12px; opacity: .75; }
  .over { position: fixed; inset: 0; display: grid; place-items: center; background: #04061ad0; padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); box-sizing: border-box; z-index: 10; }
  .card { width: min(380px, calc(100vw - 32px)); max-height: 100%; overflow: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 18px; background: #161c3c; border: 1px solid #ffffff22; box-shadow: 0 20px 60px #0008; text-align: center; }
  .card h2 { margin: 0; font-size: 28px; }
  #oWhy, #oNext { color: var(--dim); }
  #oRoles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; text-align: left; font-size: 13px; }
  #oRoles div { background: #ffffff0d; border-radius: 10px; padding: 5px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #board { text-align: left; margin: 2px 0; padding-left: 26px; font-size: 14px; min-height: 30px; }
  #board li span { float: right; }
  #board li.note { list-style: none; margin-left: -26px; text-align: center; color: var(--dim); } /* a message, not a ranked row */
  .card h3 { margin: 4px 0 0; font-size: 13px; color: var(--gold); text-align: left; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="top"><span id="phase"></span><span id="role" hidden></span></div>
<div class="hud" id="msg"></div>
<div id="side">
  <div id="hint"></div>
  <div id="chat"></div>
  <form id="say"><input id="sayText" maxlength="80" placeholder="Say something…" autocomplete="off" enterkeyhint="send"><button>Send</button></form>
  <div id="row"><button id="skip" hidden>Skip vote</button><label id="lobby" hidden>Your name <input id="name" maxlength="14" autocomplete="off"></label></div>
</div>
<div class="hud" id="net">Connecting…</div>
<div class="over" id="over" hidden><div class="card">
  <h2 id="oTitle"></h2><div id="oWhy"></div><div id="oYou" class="gold"></div>
  <div id="oRoles"></div>
  <h3>Most wins</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button class="go" id="again">Play again</button><div id="oNext"></div>
</div></div>
<script>
/* ═══ WEREWOLF NIGHT · a Multiplayer Agent starter ═════════════════════════════════════════
 * Wolves hunt by night. The village votes by day. Party, 4–10 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ every number worth tuning: timers, seats, how the bots behave
 *   ROLES & WORDS . the three roles, bot names, colors and everything the bots say
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED SECRETS  the Seal helper: a role is encrypted so only its owner can read it
 *   GAME (HOST) ... phases (lobby, night, dawn, day, verdict, over), dealing roles, the night
 *                   picks, votes, wins, seats for leavers, taking over as a new host
 *   BOTS (HOST) ... bot memory (who they suspect), what they say, how they vote and hunt
 *   ME ............ opening my role, tapping a player at night, voting, chatting
 *   DRAW .......... the village, the campfire, the villagers, gravestones, votes, bubbles
 *   SCREENS ....... HUD, banners, hints, chat panel, results, leaderboard, sounds
 *   INPUT ......... tap or click a player, Enter to chat
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `pk` (public key) once, and
 *     `hb` (heartbeat) once a second. Nobody moves, so that is all.
 *   - The HOST is the lowest sessionId among live players, worked out every frame. Only the
 *     host writes the shared fields: `game` (the whole game: phase, timers, seats, the dead
 *     and their revealed roles, who has acted tonight, votes, results; `v` goes up on every
 *     write), `roles` (each human's role, SEALED), `whisper` (night news only some may see,
 *     SEALED: the wolves' picks to the wolves, what the seer saw to the seer) and `chat`.
 *   - Roles are HIDDEN: the host seals each role to that player's key, so nobody else can read
 *     it (the host deals, so it knows). When the host changes, every player re-sends its own
 *     role to the new host ("role", sealed). A wolf or seer role nobody claims goes to a bot.
 *   - Intents to the host: "act" (sealed, so a wolf's bite, the seer's look and a villager's
 *     hunch look the same on the wire), "vote", "chat", "ready". The host checks each one.
 *   - Timers are timestamps in `game` (endsAt, votesAt); a new host carries on from them.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for every game your side wins.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 8,               // bots fill the village up to this many players (4–10)
  maxPlayers: 10,         // more people than this watch until the next game
  twoWolvesAt: 7,         // this many players or more: two werewolves, otherwise one
  lobbyMs: 7000,          // countdown before a game
  introMs: 3500,          // the role card at the start of the first night; nobody acts yet
  nightMs: 22000,         // the night: wolves hunt, the seer looks, everyone taps someone
  hurryMs: 1500,          // once everyone has acted (or voted), the phase ends this much later
  dawnMs: 5000,           // the morning news: who the wolves took
  talkMs: 15000,          // the day: talk this long before voting opens…
  voteMs: 25000,          // …then this long to vote (ends early once everyone has voted)
  verdictMs: 5500,        // who the village banished, and what they were
  overMs: 15000,          // the results screen
  leaveMs: 12000,         // a player silent this long hands its seat to a bot
  rejoinMs: 2500,         // a new host waits this long for the roles to be re-sent
  chatLines: 8,           // chat lines kept in state
  chatMax: 80,            // characters per chat line
  botLines: [1, 3],       // lines each bot says per day (fewest, most)
  botActMs: [2500, 9000], // when in the night a bot acts (ms after the night opens)
  botTrust: 0.75,         // chance a village bot believes someone claiming to be the seer
  botFakeSeer: 0.2,       // chance a bot wolf pretends to be the seer
  board: "wins",          // leaderboard: games won
};

// ── ROLES & WORDS ───────────────────────────────────────────────────────────────────
const ROLE = {
  wolf: { name: "Werewolf", color: "#ff5b6e", goal: "Pick a victim each night with your pack. Don't get caught by day." },
  seer: { name: "Seer", color: "#c39bff", goal: "Each night, look at one player and learn if they are a werewolf." },
  villager: { name: "Villager", color: "#7fd6a0", goal: "Find the werewolves and vote them out before they outnumber you." },
};
const BOT_NAMES = ["Hazel", "Bram", "Tilly", "Otto", "Mabel", "Rowan", "Pip", "Greta", "Fenn", "Ivy"];
const FRIENDLY = ["Maple", "Juniper", "Clover", "Basil", "Wren", "Sorrel", "Fable", "Briar", "Poppy", "Thistle"];
// [name, hue, saturation %, lightness %]
const COLORS = [["Red", 356, 70, 52], ["Blue", 218, 72, 58], ["Green", 140, 52, 44], ["Gold", 44, 88, 55], ["Purple", 272, 58, 60],
  ["Orange", 24, 86, 55], ["Teal", 178, 62, 42], ["Pink", 326, 70, 64], ["Lime", 88, 58, 48], ["Snow", 220, 16, 84]];
const hsl = (ci, dl = 0, a = 1) => { const c = COLORS[ci] || COLORS[0]; return `hsla(${c[1]},${c[2]}%,${c[3] + dl}%,${a})`; };
const SKIN = ["#f3cfb1", "#e3b08b", "#c98d66", "#99643f", "#6e4529", "#f7dcc4"];
// What bots say. {t} = the player they mean, {s} = who said it first, {dead} = last night's victim, {last} = who was banished.
const SAY = {
  open: ["Poor {dead}. Who did this?", "{dead} is gone. Somebody here knows why.", "I heard howling near {dead}'s house.", "Not {dead}! Okay, think, everyone."],
  quiet: ["A quiet night. Lucky us.", "Nobody taken? The wolves are getting careful.", "Everyone's still here. Suspicious."],
  right: ["{last} was a wolf! Good call, village.", "One wolf down. Keep going."],
  wrong: ["We banished {last} for nothing.", "{last} was innocent. Who pushed for that?", "That was a mistake yesterday."],
  accuse: ["I don't trust {t}.", "{t} has been way too quiet.", "My gut says {t}.", "Anyone else think {t} is acting weird?", "I'm voting {t}.", "{t}, where were you last night?", "Something about {t} feels off."],
  agree: ["Agreed, {t} looks guilty.", "{t}, explain yourself.", "I'm with {s} on {t}.", "Yeah, {t}. Let's do it."],
  defend: ["It's not me, I swear!", "Why me? I'm just a villager.", "{s} is pointing fingers to hide something.", "Seer, check me tonight. I'm clean.", "Look at {s}, not me."],
  claimWolf: ["I'm the seer. {t} is a WEREWOLF!", "Seer here. I looked at {t}: wolf!", "Trust me, I'm the seer. {t} is a wolf."],
  realSeer: ["No, I'M the seer. {t} is the wolf!", "That's a fake seer. I saw {t}: wolf."],
  claimGood: ["I'm the seer. {t} is clean.", "Seer here: {t} is on our side."],
  wolfLie: ["{t} is lying. No way they're the seer.", "Fake seer! It's {t}.", "{t} is way too eager to point fingers.", "Let's not rush. {t} feels off, though."],
  unsure: ["No idea yet.", "Skip? We don't know enough.", "Hmm.", "Let's hear from {t}.", "Could be anyone.", "I was asleep. I saw nothing."],
};

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'werewolf-night',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fb) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fb);
  memo.set(key, { raw, v });
  return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));
/** Still in the room and heard from within CONFIG.leaveMs (else a bot takes the seat). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players?.[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.leaveMs);
const nameOf = (id) => (id === net.sessionId ? myName : String(S.entities.players?.[id]?.n ?? "Player")).slice(0, 14);
const colorOf = (id) => (id === net.sessionId ? myColor : Number(S.entities.players?.[id]?.c ?? 0));
const pkOf = (id) => (id === net.sessionId ? Seal.pub : S.entities.players?.[id]?.pk);

// ── SEALED SECRETS ──────────────────────────────────────────────────────────────────
// Hidden info in a relay room. Everything in room state reaches every client, so a secret
// (your role, what the seer saw) is written SEALED: encrypted so only its one reader can open
// it. Each player publishes a public key in its own entity (`pk`); the host seals each secret
// to that key and writes the boxes into shared state.
//   - The host deals, so the host can read every secret. Fine for friends, not cheat-proof.
//   - A new host can't open boxes the old host sealed, so on a host change every player
//     re-sends its own role to the new host (sealed, with mp.send).
//   - crypto.subtle needs https or localhost. Without it seal()/open() pass the value through.
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const Seal = {
  pair: null,
  pub: "",
  keys: new Map(), // other player's public key -> derived AES key
  get on() { return !!(window.crypto && crypto.subtle); },
  /** Make this player's key pair. Returns the public key to publish: me.set("pk", pub). */
  async init() {
    if (!this.on) return "";
    this.pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    this.pub = b64(await crypto.subtle.exportKey("raw", this.pair.publicKey));
    return this.pub;
  },
  async key(otherPub) {
    let k = this.keys.get(otherPub);
    if (!k) {
      const theirs = await crypto.subtle.importKey("raw", unb64(otherPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      k = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, this.pair.privateKey, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
      this.keys.set(otherPub, k);
    }
    return k;
  },
  /** Seal any JSON value so only the holder of `toPub` (and you) can open it. */
  async seal(toPub, value) {
    if (!this.on || !toPub || !this.pair) return "p:" + JSON.stringify(value);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(toPub), new TextEncoder().encode(JSON.stringify(value)));
    return b64(iv) + "." + b64(ct);
  },
  /** Open a box sealed by the player whose public key is `fromPub`. Null if it isn't for you. */
  async open(fromPub, box) {
    if (typeof box !== "string") return null;
    if (box.startsWith("p:")) return JSON.parse(box.slice(2));
    if (!this.on || !fromPub || !this.pair) return null;
    try {
      const [iv, ct] = box.split(".").map(unb64);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await this.key(fromPub), ct);
      return JSON.parse(new TextDecoder().decode(pt));
    } catch { return null; }
  },
};

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
// What only the host knows: every role, the wolves' picks tonight, what each seer saw, the bots.
const host = { last: null, was: false, gid: 0, roles: new Map(), told: new Set(), peeks: new Map(), picks: new Map(), redealt: new Set(), known: new Map(),
  brains: new Map(), claims: new Set(), accused: new Map(), lastAccuser: new Map(), lastOut: null, plan: null,
  chat: { g: 0, c: 0, l: [] }, graceUntil: 0, needFill: false, dealing: false, sealing: false, rolesDirty: false, whisperDirty: false };
const heard = new Map(); // roles other players re-sent to me, in case I become host: id -> {g, r, w, k, p}

const gameMemo = { raw: undefined, g: null };
/** The game as state has it, or the host's own newer write that hasn't come back yet. */
function game() {
  if (gameMemo.raw !== S.shared.game) { gameMemo.raw = S.shared.game; gameMemo.g = parse(S.shared.game, null); }
  const g = gameMemo.g;
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const patch = (changes) => writeGame({ ...game(), ...changes });
const newGame = (id) => ({ id, ph: "lobby", n: 0, at: Date.now(), endsAt: Date.now() + CONFIG.lobbyMs, votesAt: 0, ros: [], dead: [], wl: 0,
  acted: [], votes: {}, night: null, out: null, win: "", reveal: null, ready: [] });
const seatIn = (g, id) => (g ? g.ros.find((r) => r.i === id) : null);
const deadEntry = (g, id) => g.dead.find((d) => d[0] === id);       // [id, role, "w" taken by wolves | "v" voted out]
const alive = (g, id) => !!g && !!seatIn(g, id) && !deadEntry(g, id);
const living = (g) => g.ros.filter((r) => !deadEntry(g, r.i)).map((r) => r.i);
const nameIn = (g, id) => seatIn(g, id)?.n || "Someone";
const roleOf = (id) => host.roles.get(id) || "villager";
const nightOpensAt = (g) => g.at + (g.n === 1 ? CONFIG.introMs : 0);
const votesOn = (g, id) => Object.values(g.votes).filter((v) => v === id).length;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.random() * (b - a);
/** The item with the highest score (null for an empty list). */
const best = (list, score) => { let top = null, hi = -Infinity; for (const x of list) { const s = score(x); if (s > hi) { hi = s; top = x; } } return top; };

/** Lobby over: seat everyone, fill with bots, deal sealed roles, the first night falls. */
async function deal(g) {
  if (host.dealing) return;
  host.dealing = true;
  try {
    const ps = S.entities.players || {};
    const hs = humans().filter((id) => ps[id] && (pkOf(id) || !Seal.on)).slice(0, CONFIG.maxPlayers);
    const nBots = Math.max(0, Math.min(CONFIG.maxPlayers, CONFIG.seats) - hs.length);
    const used = new Set(hs.map(colorOf)), free = COLORS.map((_, i) => i).filter((i) => !used.has(i)), names = shuffle([...BOT_NAMES]);
    const ros = hs.map((id) => ({ i: id, n: nameOf(id), c: colorOf(id) }));
    for (let k = 0; k < nBots; k++) ros.push({ i: "bot" + (k + 1), n: names[k % names.length], c: free[k % free.length] ?? k, b: 1 });
    shuffle(ros); // seats around the fire

cv.addEventListener("contextmenu", (e) => e.preventDefault());
$("skip").addEventListener("click", () => castVote("skip"));
$("say").addEventListener("submit", (e) => {
  e.preventDefault(); unlockAudio();
  const text = $("sayText").value.trim();
  if (text) toHost("chat", { t: text });
  $("sayText").value = "";
});
$("again").addEventListener("click", () => toHost("ready", { r: 1 }));
$("name").addEventListener("change", () => {
  myName = $("name").value.trim().slice(0, 14) || myName;
  try { localStorage.setItem("mpa-name", myName); } catch {}
  net && net.me.set("n", myName);
});
addEventListener("keydown", (e) => {
  unlockAudio();
  if (e.key === "Enter" && document.activeElement !== $("sayText") && !$("sayText").disabled) { e.preventDefault(); $("sayText").focus(); }
  if (e.key === "Escape") document.activeElement.blur();
});
document.addEventListener("touchmove", (e) => { if (!e.target.closest("#chat")) e.preventDefault(); }, { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.was = false; host.last = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  watchHost();
  if (isHost()) hostTick(); else host.was = false;
  const g = game();
  if (g) { myTick(g); effects(g, now); }
  const ph = g ? g.ph : "lobby", light = { lobby: 0.3, night: 0, dawn: 0.75, day: 1, verdict: 0.8, over: 0.55 }[ph] ?? 0.3;
  dayK += (light - dayK) * (1 - Math.exp(-dt * (ph === "dawn" ? 1.5 : 3)));
  layoutSeats(g);
  ctx.save();
  if (now < shakeUntil) ctx.translate(Math.sin(now / 20) * 4, Math.cos(now / 26) * 3);
  draw(g, now, dt);
  ctx.restore();
  if (now - lastHud > 120) { lastHud = now; if (g) hud(g); else hud(null); }
}

(async function start() {
  if (ATTRACT) {
    Object.assign(CONFIG, { seats: 8, lobbyMs: 200, introMs: 200, nightMs: 2000, hurryMs: 350, dawnMs: 1600, talkMs: 1100, voteMs: 2600, verdictMs: 1800, overMs: 3000,
      botLines: [1, 1], botActMs: [250, 1200], botFakeSeer: 0.3 });
    $("side").hidden = true;
  }
  fit();
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  for (const [type, fn] of Object.entries(HANDLERS)) net.on(type, (msg, from) => { if (isHost() && msg) fn(from, msg); });
  net.on("act", async (msg, from) => { // sealed to the host: only the host can open it
    if (!msg || msg.to !== net.sessionId || !isHost()) return;
    const d = await Seal.open(pkOf(from), msg.box);
    if (d) onAct(from, d);
  });
  net.on("role", async (msg, from) => { // a player's own role, re-sent to a new host
    if (!msg || msg.to !== net.sessionId) return;
    const v = await Seal.open(pkOf(from), msg.box);
    if (!v) return;
    heard.set(from, v);
    if (isHost()) learnRole(from, v);
  });
  net.on("who", (msg, from) => resendRole(from));
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const pk = await Seal.init().catch(() => "");
  const taken = takenColors();
  myColor = COLORS.findIndex((_, i) => !taken.has(i));
  if (myColor < 0) myColor = Math.floor(Math.random() * COLORS.length);
  $("name").value = myName;
  net.me.set({ n: myName, c: myColor, hb: Date.now(), pk });
  requestAnimationFrame(frame);
})();
</script>
